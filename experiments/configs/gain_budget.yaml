# Analytic gain budget (WP-60). PRE-REGISTERED before RTL.
# Every parameter: low / nom / high + source. "low/high" are the ends of the plausible band, and the
# optimistic/pessimistic bounds use the favourable/unfavourable end for *our* design.
# Energy per MAC of each baseline macro is normalized to 1.0 and split into component shares (sum 100).

baselines:
  midas_like:
    title: MIDAS-like bit-serial, cyclic-aligned MXFP4 DCIM
    # choi2026midas Fig. 21, macro power breakdown @0.85 V, 50 MHz (shares in %, sum 100.0)
    components: {cell_array: 11.7, mfa_tree: 44.8, lca_periph: 11.8, left_periph: 23.1, left_hole: 3.2, etc: 5.4}
    source: "choi2026midas Fig. 21"
  bitserial_int5:
    title: TSMC-style bit-serial INT5 DCIM (FP4 -> INT5 pre-decode, NOR + adder tree + shift-add)
    # [EST] shares: no published breakdown for an INT5 variant; anchored on the MIDAS split of
    # array / tree / periphery with the alignment logic removed and a shift-add accumulator added.
    components: {cell_array: 12.0, mfa_tree: 50.0, left_periph: 25.0, shift_add: 10.0, etc: 3.0}
    source: "[EST] anchored on choi2026midas Fig. 21 (R03 §2)"
  digital_mac:
    title: Weight-stationary digital MXFP4 MAC array + central SRAM (baseline c)
    # [EST] shares at the primary reuse R=256; SRAM fetch share scales as rho/R (lever weight_fetch).
    components: {mac: 45.0, operand_regs: 30.0, control: 10.0, sram_fetch: 15.0}
    source: "[EST] horowitz2014energy-style breakdown; CACTI band pending (WP-62)"

params:
  # --- alignment / exponent-handling removal (MIDAS-like only) -----------------------------------
  # fraction of each MIDAS component that is alignment/exponent logic and disappears in v2.
  # left_hole = 4-bit global counter + controller (MEPD/TAO); etc = MEPU + global BL driver;
  # lca_periph = SAs + VRDU + sign/exp latches; left_periph = row decoder, WL driver, CIB, LCG, WGSG.
  align_frac_left_hole: {low: 1.0, nom: 1.0, high: 1.0, source: "choi2026midas Fig. 21 legend (counter + controller are alignment-only)"}
  align_frac_etc:       {low: 0.5, nom: 1.0, high: 1.0, source: "choi2026midas Fig. 21 legend (MEPU + global BL driver) [EST split]"}
  align_frac_lca:       {low: 0.25, nom: 0.5, high: 0.75, source: "choi2026midas Fig. 21 legend (VRDU + exp latches vs SAs) [EST split]"}
  align_frac_left:      {low: 0.0, nom: 0.05, high: 0.10, source: "choi2026midas §III-C/Fig. 7 (CIB modes, LCG, WGSG vs drivers) [EST split]"}
  # --- bit-serial -> bit-parallel compute ---------------------------------------------------------
  # energy ratio (bit-serial / bit-parallel) of the MAC datapath (tree + leaf/MFA) on the same data
  bitparallel_factor: {low: 1.2, nom: 1.8, high: 2.2, source: "R03 §5 (~2x fewer toggles per MAC, gate-level toggle model) [EST band]"}
  # glitch penalty on the bit-parallel datapath (deep combinational tree; R03 did not model glitch)
  glitch_penalty:     {low: 1.0, nom: 1.15, high: 1.4, source: "[EST]; resolved by SDF GLS in WP-28/G1"}
  # --- storage ------------------------------------------------------------------------------------
  # v2 reads an SRAM weight set once and holds it in the leaf latch for R activation vectors;
  # bit-serial CIM touches the array every cycle. Relative SRAM read energy per weight-bit vs one
  # CIM array access per bit:
  sram_read_rel:      {low: 1.0, nom: 2.0, high: 4.0, source: "[EST]; OpenRAM sky130 characterization in WP-63"}
  reuse_R:            {low: 256, nom: 256, high: 256, source: "primary point (G1 setup)"}
  bits_per_weight_serial: {low: 5, nom: 5, high: 5, source: "INT5 bit-serial: 5 bit-planes"}
  # --- overheads specific to v2 (fractions of the baseline's total energy) ------------------------
  broadcast_overhead: {low: 0.02, nom: 0.05, high: 0.10, source: "[EST] X'/3X' row broadcast, 11 wires/row"}
  window_acc_overhead: {low: 0.01, nom: 0.03, high: 0.06, source: "[EST] 40-bit window accumulator per column"}
  shift_add_removed:  {low: 0.8, nom: 1.0, high: 1.0, source: "[EST] fraction of INT5 shift-add energy replaced by the window acc"}
  # --- baseline (c) digital MAC ----------------------------------------------------------------
  cim_locality:       {low: 0.9, nom: 1.0, high: 1.15, source: "[EST] CIM vs WS-systolic operand-register energy ratio"}
  fp4_leaf_vs_mac:    {low: 1.0, nom: 1.2, high: 1.5, source: "[EST] AND-OR FP4 leaf (43 NAND2-eq) vs generic FP4 MAC unit"}

g1_prereg:
  # fixed at pre-registration time; DO NOT edit after commit
  go_ratio_vs_int5: 1.5
  go_lower_ci: 1.3
  conditional_low: 1.2
  area_floor_tflops_mm2: 0.8
  cim_advantage_vs_c: 1.15
  g0_budget_vs_int5_optimistic: 1.2
  g0_budget_vs_c_optimistic: 1.15
